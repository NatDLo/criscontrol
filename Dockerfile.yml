FROM node:18-alpine AS frontend-builder
WORKDIR /front
COPY frontend/Finance_App/package*.json ./
RUN npm ci
COPY frontend/Finance_App/ ./
RUN npm run build -- --configuration production

FROM python:3.11-slim

ENV PYTHONDONTWRITEBYTECODE=1
ENV PYTHONUNBUFFERED=1

WORKDIR /app

RUN apt-get update \
    && apt-get install -y --no-install-recommends nginx \
    && rm -rf /var/lib/apt/lists/*

COPY backend/requirements.txt .
RUN pip install --upgrade pip setuptools wheel \
    && pip install --no-cache-dir -r requirements.txt

COPY backend/ ./
COPY --from=frontend-builder /front/dist/finance-app/browser /var/www/frontend

RUN mkdir -p /app/staticfiles

RUN rm -f /etc/nginx/sites-enabled/default && \
    cat > /etc/nginx/conf.d/default.conf <<'EOF'
server {
    listen 10000;
    server_name _;

    root /var/www/frontend;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
EOF

EXPOSE 10000

CMD ["sh", "-c", "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn backend.wsgi:application --bind 127.0.0.1:8000 --workers 3 & nginx -g 'daemon off;'"]