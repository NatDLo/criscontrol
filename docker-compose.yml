services:
  db:
    image: postgres:15-alpine
    container_name: criscontrol_db
    environment:
      POSTGRES_DB: criscontrol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: criscontrol_backend
    environment:
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-local-dev-only}
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:postgres@db:5432/criscontrol
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 backend.wsgi:application"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: criscontrol_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: